<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RUSTLINE — tactical FPS</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #1a1410; height: 100%; font-family: 'Segoe UI', system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #f0e8d8; text-shadow: 0 1px 3px rgba(0,0,0,.8); z-index: 5; }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; transform: translate(-50%, -50%); }
  #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #f0e8d8; }
  #crosshair::before { left: 10px; top: 0; width: 2px; height: 22px; }
  #crosshair::after { left: 0; top: 10px; width: 22px; height: 2px; }
  #health { position: absolute; left: 24px; bottom: 22px; font-size: 34px; font-weight: 700; }
  #healthbar { position: absolute; left: 24px; bottom: 66px; width: 220px; height: 8px; background: rgba(0,0,0,.5); }
  #healthbar::before { content: ''; display: block; height: 100%; width: 100%; background: #7ec850; }
  #ammo { position: absolute; right: 28px; bottom: 22px; font-size: 30px; font-weight: 700; text-align: right; }
  #money { position: absolute; right: 28px; bottom: 62px; font-size: 18px; color: #ffd27a; }
  #timer { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); font-size: 28px; font-weight: 700; }
  #score { position: absolute; left: 50%; top: 48px; transform: translateX(-50%); font-size: 15px; letter-spacing: 1px; }
  #feed { position: absolute; right: 24px; top: 16px; text-align: right; font-size: 14px; line-height: 1.7; }
  #banner { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); font-size: 44px; font-weight: 800; letter-spacing: 2px; opacity: 0; transition: opacity .3s; text-align: center; width: 90%; }
  #bannerSub { position: absolute; left: 50%; top: calc(22% + 54px); transform: translateX(-50%); font-size: 17px; opacity: 0; transition: opacity .3s; text-align: center; }
  #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(160,20,10,.55) 100%); opacity: 0; z-index: 4; }
  #channel { display: none; position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%); width: 260px; }
  #channelLabel { text-align: center; font-size: 14px; letter-spacing: 2px; margin-bottom: 6px; }
  #channelFill { height: 8px; background: #ffd27a; width: 0%; }
  #hint { position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%); font-size: 14px; opacity: .85; }
  #buy { display: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 420px; background: rgba(12,10,8,.92); border: 1px solid #6b5a3a; padding: 18px 22px; pointer-events: auto; z-index: 8; }
  #buy h2 { margin: 0 0 12px; font-size: 20px; letter-spacing: 2px; color: #ffd27a; }
  .buy-row { display: flex; gap: 10px; padding: 8px 4px; border-bottom: 1px solid rgba(255,255,255,.08); font-size: 16px; }
  .buy-row.poor { opacity: .45; }
  .buy-row.owned { color: #7ec850; }
  .buy-key { color: #ffd27a; width: 20px; }
  .buy-name { flex: 1; }
  .buy-price { color: #ffd27a; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(10,8,6,.72); z-index: 10; cursor: pointer; }
  #overlayTitle { font-size: 64px; font-weight: 800; letter-spacing: 8px; color: #ffd27a; }
  #overlaySub { font-size: 17px; margin-top: 12px; color: #f0e8d8; max-width: 560px; text-align: center; line-height: 1.6; }
  #end { display: none; position: fixed; inset: 0; flex-direction: column; align-items: center; justify-content: center; background: rgba(10,8,6,.78); z-index: 10; }
  #endTitle { font-size: 52px; font-weight: 800; letter-spacing: 4px; color: #ffd27a; }
  #endScore { font-size: 19px; margin-top: 14px; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="hud">
  <div id="crosshair"></div>
  <div id="healthbar"></div>
  <div id="health">100</div>
  <div id="ammo">12 / 48</div>
  <div id="money">$800</div>
  <div id="timer">1:40</div>
  <div id="score">Vanguard 0 — 0 Sentinel</div>
  <div id="feed"></div>
  <div id="banner"></div>
  <div id="bannerSub"></div>
  <div id="channel"><div id="channelLabel">PLANTING…</div><div id="channelFill"></div></div>
  <div id="hint"></div>
  <div id="buy"><h2>BUY — press 1–6, B to close</h2><div id="buyList"></div></div>
</div>
<div id="overlay"><div id="overlayTitle">RUSTLINE</div><div id="overlaySub">Vanguard vs Sentinel on the Foundry Yard. First to 5 rounds. Plant the charge or clear the yard — click to play.</div></div>
<div id="end"><div id="endTitle"></div><div id="endScore"></div></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
