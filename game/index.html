<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>RUSTLINE — Foundry Yard Tactical FPS</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0b0d10; height: 100%; font-family: 'Segoe UI', Arial, sans-serif; }
  canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #e8e8e8; user-select: none; }
  .hidden { display: none !important; }

  /* crosshair: gap driven by --gap from weapon spread */
  .crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; --gap: 8px; }
  .crosshair span { position: absolute; background: #e8ffe8; box-shadow: 0 0 3px #000; }
  .crosshair .ch-dot { width: 3px; height: 3px; left: -1.5px; top: -1.5px; border-radius: 50%; }
  .crosshair .ch-t { width: 2px; height: 9px; left: -1px; top: calc(-1 * var(--gap) - 9px); }
  .crosshair .ch-b { width: 2px; height: 9px; left: -1px; top: var(--gap); }
  .crosshair .ch-l { width: 9px; height: 2px; top: -1px; left: calc(-1 * var(--gap) - 9px); }
  .crosshair .ch-r { width: 9px; height: 2px; top: -1px; left: var(--gap); }

  .hitmark { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; opacity: 0; }
  .hitmark::before, .hitmark::after { content: ''; position: absolute; inset: 0; background:
    linear-gradient(45deg, transparent 46%, #fff 46%, #fff 54%, transparent 54%),
    linear-gradient(-45deg, transparent 46%, #fff 46%, #fff 54%, transparent 54%); }
  .hitmark.show { opacity: 1; }
  .hitmark.kill::before, .hitmark.kill::after { filter: drop-shadow(0 0 4px #ff4040); }
  .hitmark.kill { outline: 2px solid #ff4040; outline-offset: 2px; border-radius: 50%; }

  .dmgdir { position: absolute; left: 50%; top: 50%; width: 130px; height: 130px; margin: -65px 0 0 -65px; opacity: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0deg, rgba(255,40,40,0.85) 18deg, transparent 36deg, transparent 360deg); }
  .dmgdir.show { opacity: 1; }

  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; transition: opacity 0.12s; }

  .banner { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); text-align: center; opacity: 0; transition: opacity 0.25s; }
  .banner.show { opacity: 1; }
  .banner-main { font-size: 42px; font-weight: 800; letter-spacing: 4px; text-shadow: 0 2px 12px #000; }
  .banner-sub { font-size: 16px; color: #ffd27a; text-shadow: 0 1px 6px #000; }

  .nudge { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); font-size: 22px; font-weight: 700; color: #ffd24a;
    text-shadow: 0 0 12px #000; opacity: 0; animation: nudgepulse 0.9s infinite alternate; }
  .nudge.show { opacity: 1; }
  @keyframes nudgepulse { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.06); } }

  .killfeed { position: absolute; right: 18px; top: 14px; text-align: right; font-size: 14px; line-height: 1.7; }
  .kf-line { text-shadow: 0 1px 4px #000; }
  .kf-v { color: #37d67a; font-weight: 700; }
  .kf-s { color: #ff5252; font-weight: 700; }

  .timer { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); text-align: center; font-size: 30px; font-weight: 800;
    text-shadow: 0 2px 8px #000; }
  .timer .timer-phase { display: block; font-size: 12px; letter-spacing: 3px; color: #ffd27a; }
  .timer .urgent { color: #ff5252; animation: nudgepulse 0.5s infinite alternate; }

  .score { position: absolute; left: 50%; top: 74px; transform: translateX(-50%); font-size: 15px; font-weight: 700; letter-spacing: 2px;
    text-shadow: 0 1px 6px #000; }
  .sc-v { color: #37d67a; } .sc-s { color: #ff5252; } .sc-dot { margin: 0 8px; color: #888; }

  .money { position: absolute; left: 18px; top: 14px; font-size: 20px; font-weight: 800; color: #ffd24a; text-shadow: 0 1px 6px #000; }
  .spike { position: absolute; left: 18px; top: 44px; font-size: 15px; font-weight: 700; color: #ffd24a; text-shadow: 0 1px 6px #000; }
  .spike.planted { color: #ff5252; }

  .health { position: absolute; left: 18px; bottom: 18px; display: flex; align-items: center; gap: 10px; }
  .hp-num { font-size: 40px; font-weight: 800; text-shadow: 0 2px 8px #000; }
  .hp-bar { width: 170px; height: 12px; background: rgba(0,0,0,0.6); border: 1px solid #555; }
  .hp-bar i { display: block; height: 100%; background: linear-gradient(90deg, #37d67a, #7be495); }
  .armor { color: #7ad4ff; font-weight: 700; }

  .ammo { position: absolute; right: 18px; bottom: 18px; text-align: right; text-shadow: 0 2px 8px #000; }
  .ammo-mag { font-size: 44px; font-weight: 800; }
  .ammo-res { font-size: 20px; color: #aaa; }
  .weapon { position: absolute; right: 18px; bottom: 78px; font-size: 14px; letter-spacing: 2px; color: #ccc; text-shadow: 0 1px 6px #000; }

  .hint { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); font-size: 12px; color: #999; text-shadow: 0 1px 4px #000; }
  .minimap { position: absolute; right: 18px; top: 120px; border: 1px solid rgba(255,255,255,0.25); background: rgba(0,0,0,0.4); }

  .buymenu { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 420px; background: rgba(10,12,16,0.92);
    border: 1px solid #444; padding: 18px; pointer-events: auto; }
  .buy-title { font-size: 18px; font-weight: 800; letter-spacing: 2px; margin-bottom: 12px; color: #ffd24a; }
  .buy-list { display: flex; flex-direction: column; gap: 6px; }
  .buy-item { display: flex; justify-content: space-between; background: #1c2126; color: #e8e8e8; border: 1px solid #333;
    padding: 9px 12px; font-size: 14px; cursor: pointer; text-align: left; }
  .buy-item:hover { background: #2a3430; border-color: #37d67a; }
  .buy-key { color: #ffd24a; font-weight: 700; margin-right: 8px; }
  .buy-price { color: #ffd24a; font-weight: 700; }
  .buy-close { margin-top: 12px; width: 100%; padding: 9px; background: #333; color: #fff; border: none; cursor: pointer; font-size: 14px; }

  .endscreen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(5,6,8,0.82); pointer-events: auto; }
  .end-title { font-size: 56px; font-weight: 900; letter-spacing: 6px; }
  .end-score { font-size: 40px; font-weight: 800; margin-top: 8px; }
  .end-sub { margin-top: 14px; color: #aaa; }

  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(5,6,8,0.55); pointer-events: none; }
  .center .title { font-size: 64px; font-weight: 900; letter-spacing: 10px; text-shadow: 0 4px 20px #000; }
  .center .sub { font-size: 18px; color: #ffd27a; margin-top: 10px; text-shadow: 0 2px 8px #000; }
</style>
</head>
<body>
<div id="hud"></div>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
